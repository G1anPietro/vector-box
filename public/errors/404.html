<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title data-i18n="e404_page">404 // Page not found</title>
<script src="/js/i18n.js"></script>

</head>
<body>
<main class="err">

    <a class="err-btn err-btn-alt" href="#" id="err-back" data-i18n="back">// GO_BACK</a>
