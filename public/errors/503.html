<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="e503_page">503 // Service unavailable</title>
<script src="/js/i18n.js"></script>
<link rel="stylesheet" href="/errors/errors.css">
</head>
<body data-retry="1">
<main class="err">
  <div class="err-tag">// SYSTEM_OFFLINE</div>
  <h1 class="err-code" data-text="503">503</h1>
  <h2 class="err-title" data-i18n="e503_title">Service unavailable</h2>
  <p class="err-text" data-i18n="e503_text">The site is down for maintenance or overloaded. Retrying by itself.</p>
  <p class="err-retry" id="err-retry" hidden><span data-i18n="retry">Trying again in</span> <b id="err-count">15</b>s</p>
  <div class="err-actions">
    <a class="err-btn" href="/" data-i18n="home">// RETURN_HOME</a>
    <a class="err-btn err-btn-alt" href="#" id="err-back" data-i18n="back">// GO_BACK</a>
  </div>
  <p class="err-foot">vector-box · error 503</p>
</main>
<script src="/errors/errors.js"></script>
</body>
</html>
