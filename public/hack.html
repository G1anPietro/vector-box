<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL // HEX_BREACH</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hack-container {
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        .hack-status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .target-sequence {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .target-node {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.4);
            color: #888;
        }

        .target-node.matched {
            border-color: #00ff66;
            color: #00ff66;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        .hex-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .hex-btn {
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 14px 0;
            font-family: monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .hex-btn:hover {
            background: rgba(0, 255, 102, 0.25);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            color: #fff;
        }

        .hex-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            border-color: #333;
        }

        .hack-result {
            height: 24px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <header class="cyber-header">
        <div class="glitch">// VECTOR-BOX // HEX_BREACH_PROTOCOL</div>
        <a href="index.php" class="nav-btn"><_ BACK_TO_TERMINAL</a>
    </header>

    <main class="center-container">
        <div class="cyber-panel public-panel hack-container">
            <h2>>_ SYSTEM_NODE_BREACH</h2>
            
            <div class="hack-status-bar">
                <span>BUFFER_TIME: <b id="timer-val" style="color: #00ff66;">15s</b></span>
                <span>SECURITY_LEVEL: <b style="color: #ffaa00;">HIGH</b></span>
            </div>

            <p class="term-muted" style="margin-bottom: 5px;">MATCH TARGET SEQUENCE IN ORDER:</p>
            <div id="target-container" class="target-sequence"></div>

            <div id="hex-grid" class="hex-grid"></div>

            <div id="hack-result" class="hack-result"></div>

            <div class="btn-group" style="justify-content: center; margin-top: 15px;">
                <button id="reset-hack-btn" class="action-btn execution-btn" style="max-width: 200px;">>_ RESTART BREACH</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const hexPool = ["1C", "E9", "55", "BD", "7A", "FF", "C3", "AA"];
            let targetSeq = [];
            let currentStep = 0;
            let timeLeft = 15;
            let timerInterval = null;

            const targetContainer = document.getElementById("target-container");
            const hexGrid = document.getElementById("hex-grid");
            const timerVal = document.getElementById("timer-val");
            const hackResult = document.getElementById("hack-result");
            const resetBtn = document.getElementById("reset-hack-btn");

            function initGame() {
                clearInterval(timerInterval);
                currentStep = 0;
                timeLeft = 15;
                hackResult.innerHTML = "";
                timerVal.innerText = `${timeLeft}s`;
                timerVal.style.color = "#00ff66";

                // Pick 3 random hex values for sequence
                targetSeq = [];
                for (let i = 0; i < 3; i++) {
                    targetSeq.push(hexPool[Math.floor(Math.random() * hexPool.length)]);
                }

                // Render Target Nodes
                targetContainer.innerHTML = targetSeq.map((hex, i) => 
                    `<div class="target-node" id="target-${i}">${hex}</div>`
                ).join("");

                // Build 15 Grid Buttons (guarantee target elements exist inside pool)
                let gridItems = [...targetSeq];
                while (gridItems.length < 15) {
                    gridItems.push(hexPool[Math.floor(Math.random() * hexPool.length)]);
                }
                gridItems.sort(() => Math.random() - 0.5);

                // Render Grid Buttons
                hexGrid.innerHTML = gridItems.map((hex, i) => 
                    `<button class="hex-btn" data-hex="${hex}">${hex}</button>`
                ).join("");

                // Attach Grid Event Handlers
                document.querySelectorAll(".hex-btn").forEach(btn => {
                    btn.addEventListener("click", () => handleHexClick(btn));
                });

                // Start Countdown
                timerInterval = setInterval(() => {
                    timeLeft--;
                    timerVal.innerText = `${timeLeft}s`;
                    if (timeLeft <= 5) timerVal.style.color = "#ff3333";
                    if (timeLeft <= 0) endGame(false, ">> BREACH FAILED: BUFFER OVERFLOW");
                }, 1000);
            }

            function handleHexClick(btn) {
                const selectedHex = btn.getAttribute("data-hex");

                if (selectedHex === targetSeq[currentStep]) {
                    document.getElementById(`target-${currentStep}`).classList.add("matched");
                    btn.disabled = true;
                    currentStep++;

                    if (currentStep === targetSeq.length) {
                        endGame(true, ">> BREACH SUCCESSFUL: ACCESS GRANTED");
                    }
                } else {
                    endGame(false, ">> BREACH FAILED: TRACE DETECTED");
                }
            }

            function endGame(success, message) {
                clearInterval(timerInterval);
                document.querySelectorAll(".hex-btn").forEach(btn => btn.disabled = true);
                
                if (success) {
                    hackResult.innerHTML = `<span style="color: #00ff66;">${message}</span>`;
                } else {
                    hackResult.innerHTML = `<span style="color: #ff3333;">${message}</span>`;
                }
            }

            resetBtn.addEventListener("click", initGame);
            initGame();
        });
    </script>
</body>
</html>
