<body>
    <header class="mn-top">
        <a href="giochi.php">← Giochi</a>
        <h1>Campo minato</h1>
        <span class="mn-led" title="Record" aria-label="Record" id="mn-best">—</span>
    </header>
    <div class="mn-bar" role="group" aria-label="Livello">
        <button type="button" data-level="easy" aria-pressed="true">Facile</button>
        <button type="button" data-level="medium" aria-pressed="false">Medio</button>
        <button type="button" data-level="hard" aria-pressed="false">Difficile</button>
    </div>
    <div class="mn-bar">
        <span class="mn-led" id="mn-mines" aria-label="Mine rimaste">010</span>
        <button type="button" class="mn-face" id="mn-face" aria-label="Nuova partita">:)</button>
        <span class="mn-led" id="mn-time" aria-label="Secondi">000</span>
        <button type="button" id="mn-flag" aria-pressed="false">⚑ Bandierina</button>
    </div>
    <div class="mn-wrap"><div id="mn-board" aria-label="Campo"></div></div>
    <div id="mn-msg" role="status"></div>
    <p class="mn-help">Clic per aprire, clic destro o tocco lungo per la bandierina (o il tasto qui sopra). Su un numero con le bandierine giuste, un clic apre tutti i vicini. Tastiera: frecce, Spazio, F. Il primo clic è sempre sicuro.</p>
