<body>
    <header class="mn-top">
        <a href="giochi.php" data-i18n="back">← Games</a>
        <h1 data-i18n="h1">Minesweeper</h1>
        <span id="fx-toggle"></span>
        <span class="mn-led" title="Best" aria-label="Best" data-i18n-attr="title:best;aria-label:best" id="mn-best">—</span>
    </header>
    <div class="mn-bar" role="group" aria-label="Level" data-i18n-attr="aria-label:level">
        <button type="button" data-level="easy" aria-pressed="true" data-i18n="easy">Easy</button>
        <button type="button" data-level="medium" aria-pressed="false" data-i18n="medium">Medium</button>
        <button type="button" data-level="hard" aria-pressed="false" data-i18n="hard">Hard</button>
        <button type="button" id="mn-pause" aria-pressed="false" data-i18n="pause">Pause</button>
    </div>
    <div class="mn-bar">
        <span class="mn-led" id="mn-mines" aria-label="Mines left" data-i18n-attr="aria-label:mines_left">010</span>
        <button type="button" class="mn-face" id="mn-face" aria-label="New game" data-i18n-attr="aria-label:new_game">:)</button>
        <span class="mn-led" id="mn-time" aria-label="Seconds" data-i18n-attr="aria-label:seconds">000</span>
        <button type="button" id="mn-flag" aria-pressed="false" data-i18n="flag">⚑ Flag</button>
    </div>
    <div class="mn-wrap"><div id="mn-board" aria-label="Minefield" data-i18n-attr="aria-label:field"></div></div>
    <div id="mn-msg" role="status"></div>
    <p class="mn-help" data-i18n="help">Click to open, right-click or long press to plant a flag (or use the button above). On a number with the right flags around it, one click opens all its neighbours. Keyboard: arrows, Space, F, P pauses. The first click is always safe.</p>
