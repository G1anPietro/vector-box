<body>
    <header class="ar-top"><a href="giochi.php">← Giochi</a><h1>Tetris</h1><button type="button" id="tt-new">Nuova</button></header>
    <div class="tt-wrap">
        <canvas id="tt-canvas" width="240" height="480" aria-label="Campo di gioco"></canvas>
        <div class="tt-side">
            <div class="ar-box tt-small"><small>Punti</small><strong id="tt-score">0</strong></div>
            <div class="ar-box tt-small"><small>Righe</small><strong id="tt-lines">0</strong></div>
            <div class="ar-box tt-small"><small>Livello</small><strong id="tt-level">1</strong></div>
            <div class="ar-box tt-small"><small>Record</small><strong id="tt-best">0</strong></div>
            <canvas id="tt-next" width="80" height="60" aria-label="Pezzo successivo"></canvas>
        </div>
    </div>
    <div id="tt-msg" class="ar-msg" role="status"></div>
    <div class="tt-pad" aria-label="Comandi">
        <button type="button" data-act="left" aria-label="Sinistra">◀</button>
        <button type="button" data-act="rotate" aria-label="Ruota">⟳</button>
        <button type="button" data-act="right" aria-label="Destra">▶</button>
        <button type="button" data-act="down" aria-label="Giù">▼</button>
        <button type="button" data-act="drop" aria-label="Caduta veloce">⤓</button>
    </div>
    <p class="ar-help">Frecce o W A S D: muovi e ruota (Z e X girano nei due sensi), Spazio per far cadere subito il pezzo. Completa le righe per fare punti: ogni 10 righe si sale di livello. In pausa se cambi scheda.</p>
