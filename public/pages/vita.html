<body>
    <header class="ar-top"><a href="giochi.php" data-i18n="back">← Games</a><h1 data-i18n="title_h">Game of Life</h1></header>
    <div class="ar-bar">
        <div class="ar-box"><small data-i18n="gen">Generation</small><strong id="vi-gen">0</strong></div>
        <div class="ar-box"><small data-i18n="pop">Alive</small><strong id="vi-pop">0</strong></div>
    </div>
    <canvas id="vi-canvas" width="400" height="400" aria-label="Playing field" data-i18n-attr="aria-label:field"></canvas>
    <div class="vi-ctrl">
        <button type="button" id="vi-run" aria-pressed="false">Start</button>
        <button type="button" id="vi-step" data-i18n="step">Step</button>
        <button type="button" id="vi-random" data-i18n="random">Random</button>
        <button type="button" id="vi-clear" data-i18n="clear">Clear</button>
    </div>
    <div class="vi-ctrl">
        <label><span data-i18n="pattern">Pattern</span>
            <select id="vi-pat">
                <option value="" data-i18n="p_draw">Draw your own</option>
                <option value="glider" data-i18n="p_glider">Glider</option>
                <option value="blinker" data-i18n="p_blinker">Blinker</option>
                <option value="pulsar" data-i18n="p_pulsar">Pulsar</option>
                <option value="gun" data-i18n="p_gun">Gosper glider gun</option>
            </select>
        </label>
        <label><span data-i18n="speed">Speed</span><input type="range" id="vi-speed" min="1" max="8" value="4"></label>
    </div>
    <p class="ar-help" data-i18n="help">Tap or drag on the field to draw or erase cells. A live cell with 2 or 3 live neighbours survives; a dead cell with exactly 3 is born. The edges wrap around. Space starts and stops, S takes one step.</p>
    <div id="vb-lang" style="text-align:center;margin:10px 0"></div>
</body>
