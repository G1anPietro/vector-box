<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Who's the Spy</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --surface-color: #1a162b;
            --primary-color: #7b2cbf;
            --primary-hover: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #a09cb0;
            --danger: #ff4757;
            --accent: #00f5d4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        #app-container {
            width: 100%;
            max-width: 420px;
            background: var(--surface-color);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            min-height: 520px;
            display: flex;
            flex-direction: column;
        }

        h1 { font-size: 22px; margin-bottom: 20px; color: var(--accent); }
        h2 { font-size: 18px; margin-bottom: 15px; }
        
        .screen { display: none; flex: 1; flex-direction: column; justify-content: center; }
        .screen.active { display: flex; }

        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        input[type="text"] {
            flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #2e2845;
            background: #120e24; color: white; font-size: 15px; outline: none;
        }
        
        button {
            padding: 12px 20px; border-radius: 10px; border: none;
            background: var(--primary-color); color: white; font-size: 15px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        button:active { transform: scale(0.96); }
        .btn-add { background: var(--primary-color); }
        .btn-start { background: var(--accent); color: #000; width: 100%; margin-top: 15px; font-size: 16px; padding: 14px;}
        .btn-remove { background: transparent; color: var(--danger); font-size: 18px; padding: 0 8px; }

        .player-list { list-style: none; margin-bottom: 15px; text-align: left; max-height: 180px; overflow-y: auto; }
        .player-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #231e38; padding: 10px 14px; border-radius: 8px; margin-bottom: 6px;
        }

        .settings { background: #231e38; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
        .settings-row { display: flex; justify-content: space-between; align-items: center; }
        .controls { display: flex; align-items: center; gap: 12px; font-size: 18px; }
        .controls button { padding: 4px 12px; font-size: 18px; background: #322b4d; }

        .big-text { font-size: 28px; font-weight: bold; margin-bottom: 15px; color: var(--accent); }
        .role-text { font-size: 24px; margin: 15px 0; font-weight: bold; }
        .sub-text { font-size: 15px; color: var(--text-muted); margin-bottom: 20px; }
        .spy-alert { color: var(--danger); font-size: 30px; font-weight: bold; text-transform: uppercase; margin: 15px 0; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 420px; margin-bottom: 15px; }
        .top-nav a { color: var(--text-muted); text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="../index.php">← Torna al Terminale</a>
        <span style="font-size: 12px; color: #555;">Who's The Spy v1.2</span>
    </div>

    <div id="app-container">
        <div id="screen-setup" class="screen active">
            <h1>Impostazioni Partita</h1>
            
            <div class="input-group">
                <input type="text" id="player-input" placeholder="Nome giocatore...">
                <button class="btn-add" onclick="addPlayer()">+</button>
            </div>

            <ul id="player-list" class="player-list"></ul>

            <div class="settings">
                <div class="settings-row">
                    <span>Numero di Spie:</span>
                    <div class="controls">
                        <button onclick="changeSpies(-1)">-</button>
                        <span id="spy-count">1</span>
                        <button onclick="changeSpies(1)">+</button>
                    </div>
                </div>
            </div>

            <button class="btn-start" onclick="startGame()">Inizia Gioco</button>
        </div>

        <div id="screen-pass" class="screen">
            <h2>Passa il telefono a:</h2>
            <div id="pass-player-name" class="big-text">Nome</div>
            <p class="sub-text">Assicurati che nessuno stia guardando!</p>
            <button class="btn-start" onclick="showRole()">Tocca per vedere il ruolo</button>
        </div>

        <div id="screen-role" class="screen">
            <h2 id="role-player-name">Nome</h2>
            <div id="role-content"></div>
            <button class="btn-start" onclick="nextPlayer()">Ho capito, nascondi</button>
        </div>

        <div id="screen-active" class="screen">
            <h1>Il gioco è iniziato!</h1>
            <p class="sub-text">Fatevi una domanda a testa per capire chi mente.</p>
            <div id="starting-player" class="spy-alert" style="color: var(--accent); font-size: 22px;"></div>
            <button class="btn-start" style="margin-top:auto;" onclick="resetGame()">Nuova Partita</button>
        </div>
    </div>

    <script>
        let players = [];
        let numSpies = 1;
        let gameData = { locations: [] };
        let currentPlayerIndex = 0;
        let assignedRoles = [];

        function setCookie(name, value, days = 30) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${encodeURIComponent(JSON.stringify(value))}; expires=${date.toUTCString()}; path=/`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp(`(?:^|; )${name}=([^;]*)`));
            if (match) {
                try { return JSON.parse(decodeURIComponent(match[1])); } catch (e) {}
            }
            return null;
        }

        window.onload = async () => {
            const savedPlayers = getCookie('spia_players');
            if (Array.isArray(savedPlayers)) {
                players = savedPlayers;
                updatePlayerList();
            }

            try {
                const response = await fetch('../assets/data.json');
                gameData = await response.json();
            } catch (error) {
                console.error("Errore caricamento data.json:", error);
            }

            const playerInput = document.getElementById('player-input');
            if (playerInput) {
                playerInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') addPlayer();
                });
            }
        };

        function addPlayer() {
            const input = document.getElementById('player-input');
            const name = input.value.trim();
            if (name && !players.includes(name)) {
                players.push(name);
                input.value = '';
                setCookie('spia_players', players);
                updatePlayerList();
            }
        }

        function removePlayer(name) {
            players = players.filter(p => p !== name);
            setCookie('spia_players', players);
            updatePlayerList();
        }

        function updatePlayerList() {
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            players.forEach(name => {
                const li = document.createElement('li');
                li.className = 'player-item';
                li.innerHTML = `<span>${name}</span> <button class="btn-remove" onclick="removePlayer('${name}')">×</button>`;
                list.appendChild(li);
            });
        }

        function changeSpies(delta) {
            numSpies += delta;
            if (numSpies < 1) numSpies = 1;
            const maxSpies = players.length > 1 ? players.length - 1 : 1;
            if (numSpies > maxSpies) numSpies = maxSpies;
            document.getElementById('spy-count').innerText = numSpies;
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startGame() {
            if (players.length < 3) {
                alert("Servono almeno 3 giocatori!");
                return;
            }
            if (!gameData.locations || gameData.locations.length === 0) {
                alert("Dati dei luoghi non disponibili!");
                return;
            }

            const locationIndex = Math.floor(Math.random() * gameData.locations.length);
            const selectedLocation = gameData.locations[locationIndex];

            let availableRoles = [...selectedLocation.roles];
            shuffleArray(availableRoles);

            let playerPool = [...players];
            shuffleArray(playerPool);
            
            assignedRoles = [];
            for (let i = 0; i < playerPool.length; i++) {
                if (i < numSpies) {
                    assignedRoles.push({ name: playerPool[i], isSpy: true });
                } else {
                    let role = availableRoles.pop() || "Civile"; 
                    assignedRoles.push({ name: playerPool[i], isSpy: false, location: selectedLocation.name, role: role });
                }
            }

            shuffleArray(assignedRoles);
            currentPlayerIndex = 0;
            showPassScreen();
        }

        function showPassScreen() {
            if (currentPlayerIndex >= assignedRoles.length) {
                startDiscussion();
                return;
            }
            const player = assignedRoles[currentPlayerIndex];
            document.getElementById('pass-player-name').innerText = player.name;
            switchScreen('screen-pass');
        }

        function showRole() {
            const player = assignedRoles[currentPlayerIndex];
            document.getElementById('role-player-name').innerText = "Turno di: " + player.name;
            
            const content = document.getElementById('role-content');
            if (player.isSpy) {
                content.innerHTML = `<div class="spy-alert">SEI LA SPIA!</div><p class="sub-text">Cerca di capire dove vi trovate ascoltando gli altri.</p>`;
            } else {
                content.innerHTML = `
                    <div class="sub-text">Luogo Segreto:</div>
                    <div class="big-text">${player.location}</div>
                    <div class="sub-text">Il tuo ruolo:</div>
                    <div class="role-text">${player.role}</div>
                `;
            }
            switchScreen('screen-role');
        }

        function nextPlayer() {
            currentPlayerIndex++;
            showPassScreen();
        }

        function startDiscussion() {
            const randomIndex = Math.floor(Math.random() * players.length);
            const primoGiocatore = players[randomIndex];
            document.getElementById('starting-player').innerText = "Inizia il turno: \n" + primoGiocatore;
            switchScreen('screen-active');
        }

        function resetGame() {
            switchScreen('screen-setup');
        }
    </script>
</body>
</html>
