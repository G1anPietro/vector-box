<!-- Open this file straight from the disk (file://): no server. Every sprite at 64 px (both idle frames) and at the 16 / 24 / 36 px of the game, with its name;

<style>
body { background: #05080a; color: #b8d8c0; font: 12px monospace; margin: 12px; }

.g { display: flex; flex-wrap: wrap; gap: 6px; }
.c { background: #0d1410; border: 1px solid #1c2a20; padding: 4px; width: 200px; }
.c.fb { border-color: #ffb000; } .c.miss { border-color: #ff4d4d; }
.c .r { display: flex; gap: 3px; align-items: flex-end; margin-bottom: 3px; }
canvas { image-rendering: pixelated; }
.n { color: #e8f4ea; word-break: break-all; } .f { color: #ffb000; }
.strip { display: flex; gap: 0; margin: 3px 0; flex-wrap: wrap; }
